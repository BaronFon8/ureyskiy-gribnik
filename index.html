<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Урейский Грибник</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Russo+One&display=swap');

        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            height: 100dvh;
            background-color: #1a1a1a;
            font-family: 'Russo One', sans-serif;
            overflow: hidden;
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
        }

        #game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            max-width: 800px;
            max-height: 100vh;
            overflow: hidden;
            background: #2c3e50;
        }

        @media (min-width: 800px) {
            #game-container {
                width: 800px;
                height: 600px;
                border: 4px solid #fff;
                box-shadow: 0 0 20px rgba(0,0,0,0.8);
            }
        }

        #background {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url('bg.jpg');
            background-size: cover;
            background-position: center;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
            filter: contrast(1.3) saturate(1.4) blur(2px) brightness(0.6);
            z-index: 1;
            transition: filter 3s ease-in-out;
        }

        #night-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #000;
            opacity: 0;
            pointer-events: none;
            z-index: 2;
            transition: opacity 3s ease-in-out;
        }

        #pixel-grid {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                linear-gradient(rgba(0,0,0,0.15) 2px, transparent 2px),
                linear-gradient(90deg, rgba(0,0,0,0.15) 2px, transparent 2px);
            background-size: 6px 6px;
            z-index: 3;
            pointer-events: none;
        }

        canvas {
            position: absolute;
            top: 0;
            left: 0;
            z-index: 4;
            width: 100%;
            height: 100%;
        }

        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 5;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            pointer-events: none;
        }

        #hud {
            position: absolute;
            top: 15px;
            left: 15px;
            right: 15px;
            display: flex;
            justify-content: space-between;
            pointer-events: none;
            z-index: 6;
            text-shadow: 2px 2px 0 #000;
        }

        .hud-item {
            background: rgba(0,0,0,0.7);
            padding: 8px 15px;
            border-radius: 10px;
            border: 3px solid #f1c40f;
            color: white;
            font-size: 16px;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        @keyframes drunkShake {
            0% { transform: translate(0, 0) rotate(0deg); }
            25% { transform: translate(-5px, 5px) rotate(-2deg); }
            50% { transform: translate(5px, -5px) rotate(2deg); }
            75% { transform: translate(-5px, -5px) rotate(-1deg); }
            100% { transform: translate(0, 0) rotate(0deg); }
        }

        .drunk-mode {
            animation: drunkShake 0.5s infinite;
        }

        .menu-box {
            background: rgba(0, 0, 0, 0.9);
            padding: 20px 20px;
            border: 4px solid #f1c40f;
            border-radius: 15px;
            text-align: center;
            color: white;
            pointer-events: auto;
            width: 90%;
            max-width: 480px;
            box-sizing: border-box;
            box-shadow: 0 0 30px rgba(241, 196, 15, 0.5);
            max-height: 95vh;
            overflow-y: auto;
        }
        
        .menu-box::-webkit-scrollbar { width: 0px; }

        h1 {
            font-size: 22px;
            margin-bottom: 10px;
            color: #f1c40f;
            text-shadow: 3px 3px 0px #e74c3c;
            line-height: 1.3;
        }

        h2 {
            font-size: 16px;
            color: #f1c40f;
            margin: 10px 0 5px 0;
        }

        p {
            font-size: 13px;
            margin: 8px 0;
            line-height: 1.5;
            color: #ecf0f1;
        }

        .bonus-legend {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 10px;
            background: rgba(255,255,255,0.1);
            padding: 8px;
            border-radius: 8px;
            flex-wrap: wrap;
        }
        .bonus-item {
            font-size: 12px;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        #name-input {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border-radius: 8px;
            border: 2px solid #f1c40f;
            background: #333;
            color: white;
            font-family: 'Russo One', sans-serif;
            font-size: 16px;
            text-align: center;
            box-sizing: border-box;
        }
        #name-input:focus {
            outline: none;
            border-color: #e74c3c;
        }

        #save-score-btn {
            background-color: #27ae60;
            box-shadow: 0 5px 0 #1e8449;
            justify-content: center;
            margin-top: 10px;
        }
        #save-score-btn:active {
            background-color: #1e8449;
            box-shadow: 0 0px 0 #1e8449;
        }

        button {
            font-family: 'Russo One', sans-serif;
            font-size: 15px;
            padding: 12px 15px;
            margin-top: 8px;
            background-color: #e74c3c;
            color: white;
            border: 3px solid white;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.1s;
            width: 100%;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            box-shadow: 0 5px 0 #c0392b;
            display: flex;
            align-items: center;
            justify-content: flex-start;
            gap: 12px;
        }

        button:active {
            background-color: #c0392b;
            transform: translateY(5px);
            box-shadow: 0 0px 0 #c0392b;
        }

        .btn-easy { background-color: #27ae60; box-shadow: 0 5px 0 #1e8449; }
        .btn-easy:active { background-color: #1e8449; box-shadow: 0 0px 0 #1e8449; }
        
        .btn-hard { background-color: #8e44ad; box-shadow: 0 5px 0 #6c3483; }
        .btn-hard:active { background-color: #6c3483; box-shadow: 0 0px 0 #6c3483; }

        .btn-icon {
            font-size: 28px;
            line-height: 1;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 32px;
            height: 32px;
        }

        .btn-text {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            text-align: left;
        }

        .difficulty-desc {
            font-size: 11px;
            color: rgba(255,255,255,0.8);
            margin-top: 2px;
            font-family: sans-serif;
            font-weight: normal;
        }

        #leaderboard {
            background: rgba(255,255,255,0.1);
            border-radius: 10px;
            padding: 10px;
            margin: 15px 0;
            border: 1px solid rgba(255,255,255,0.3);
        }

        .record-row {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            padding: 4px 0;
            border-bottom: 1px dashed rgba(255,255,255,0.2);
            font-family: sans-serif;
            font-weight: bold;
            align-items: center;
        }
        .record-row:last-child { border-bottom: none; }
        
        .record-rank { color: #f1c40f; width: 25px; text-align: left; }
        .record-name { color: #fff; flex-grow: 1; text-align: left; margin: 0 10px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100px; }
        .record-score { color: #e74c3c; width: 40px; text-align: right; }
        .record-diff { color: #bdc3c7; font-size: 10px; text-transform: uppercase; width: 60px; text-align: right; }

        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>

    <div id="game-container">
        <div id="background"></div>
        <div id="night-overlay"></div>
        <div id="pixel-grid"></div>
        
        <div id="hud" class="hidden">
            <div class="hud-item">🍄 СЧЁТ: <span id="score-display" style="color:#f1c40f;">0</span></div>
            <div class="hud-item">❤️ ЖИЗНИ: <span id="lives-display" style="color:#e74c3c;">3</span></div>
        </div>

        <canvas id="gameCanvas"></canvas>
        
        <div id="ui-layer">
            <div id="start-screen" class="menu-box">
                <h1>УРЕЙСКИЙ ГРИБНИК</h1>
                
                <div class="bonus-legend">
                    <div class="bonus-item">✨ <span style="color:#ffd700;">Золотой</span> (+100)</div>
                    <div class="bonus-item">🐿️ <span style="color:#e67e22;">Белка</span> (+1000)</div>
                </div>

                <p>Кликай по падающим грибам!</p>
                <p style="color: #e74c3c;">Не упускай съедобные грибы!</p>
                
                <hr style="border-color: #555; margin: 15px 0;">
                <p style="margin-bottom: 5px;">ВЫБЕРИ СЛОЖНОСТЬ:</p>
                
                <button id="btn-easy" class="btn-easy">
                    <div class="btn-icon">🚚</div>
                    <div class="btn-text">
                        <span>ДОРОЖНОЕ</span>
                        <span class="difficulty-desc">(3 жизни)</span>
                    </div>
                </button>
                
                <button id="btn-normal">
                    <div class="btn-icon">🌲</div>
                    <div class="btn-text">
                        <span>АКША</span>
                        <span class="difficulty-desc">(2 жизни)</span>
                    </div>
                </button>
                
                <button id="btn-hard" class="btn-hard">
                    <div class="btn-icon">🍄</div>
                    <div class="btn-text">
                        <span>УРЕЙСК</span>
                        <span class="difficulty-desc">(1 жизнь)</span>
                    </div>
                </button>

                <div id="leaderboard">
                    <h2>🏆 РЕЙТИНГ ГРИБНИКОВ</h2>
                    <div id="records-list">
                        <div class="record-row"><span style="color:#7f8c8d;">Пока нет рекордов...</span></div>
                    </div>
                </div>
            </div>
            
            <div id="game-over-screen" class="menu-box hidden">
                <h1>КОРЗИНА ПУСТА!</h1>
                <p>Твой результат: <span id="final-score" style="color:#f1c40f; font-size: 24px;">0</span> очков</p>
                <p id="phrase-text" style="color: #f1c40f; font-size: 13px; background: rgba(255,255,255,0.1); padding: 10px; border-radius: 8px;"></p>
                
                <div id="save-score-block">
                    <input type="text" id="name-input" placeholder="Введите имя" maxlength="10">
                    <button id="save-score-btn" style="justify-content: center;">
                        <span id="save-btn-text">СОХРАНИТЬ РЕКОРД</span>
                    </button>
                </div>
                
                <hr style="border-color: #555; margin: 15px 0;">
                
                <button id="restart-btn" style="justify-content: center;">
                    <span>ИГРАТЬ СНОВА</span>
                </button>
                
                <button id="menu-btn" style="background-color: #7f8c8d; box-shadow: 0 5px 0 #566573; margin-top: 15px; justify-content: center;">
                    <span>В ГЛАВНОЕ МЕНЮ</span>
                </button>
            </div>
        </div>
    </div>

    <script>
        // --- АУДИО СИСТЕМА ---
        let audioCtx;
        function initAudio() {
            if (!audioCtx) {
                try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e) {}
            }
            if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
        }

        function playSound(type) {
            if (!audioCtx) return;
            try {
                const osc = audioCtx.createOscillator();
                const gainNode = audioCtx.createGain();
                osc.connect(gainNode);
                gainNode.connect(audioCtx.destination);
                const now = audioCtx.currentTime;

                if (type === 'pop') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(600, now);
                    osc.frequency.exponentialRampToValueAtTime(1200, now + 0.1);
                    gainNode.gain.setValueAtTime(0.3, now);
                    gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
                    osc.start(now); osc.stop(now + 0.1);
                } else if (type === 'golden') {
                    osc.type = 'square';
                    osc.frequency.setValueAtTime(800, now);
                    osc.frequency.setValueAtTime(1200, now + 0.1);
                    osc.frequency.setValueAtTime(1600, now + 0.2);
                    gainNode.gain.setValueAtTime(0.2, now);
                    gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
                    osc.start(now); osc.stop(now + 0.3);
                } else if (type === 'squirrelCatch') { 
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(1000, now);
                    osc.frequency.setValueAtTime(1500, now + 0.1);
                    osc.frequency.setValueAtTime(2000, now + 0.2);
                    gainNode.gain.setValueAtTime(0.3, now);
                    gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.4);
                    osc.start(now); osc.stop(now + 0.4);
                } else if (type === 'drunk') { 
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(400, now);
                    osc.frequency.exponentialRampToValueAtTime(200, now + 0.1);
                    osc.frequency.exponentialRampToValueAtTime(300, now + 0.2);
                    gainNode.gain.setValueAtTime(0.4, now);
                    gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
                    osc.start(now); osc.stop(now + 0.3);
                } else if (type === 'squirrel') { 
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(1500, now);
                    osc.frequency.exponentialRampToValueAtTime(2500, now + 0.1);
                    gainNode.gain.setValueAtTime(0.15, now);
                    gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.15);
                    osc.start(now); osc.stop(now + 0.15);
                } else if (type === 'lose') {
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(150, now);
                    osc.frequency.exponentialRampToValueAtTime(50, now + 0.3);
                    gainNode.gain.setValueAtTime(0.5, now);
                    gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
                    osc.start(now); osc.stop(now + 0.3);
                } else if (type === 'gameover') {
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(400, now);
                    osc.frequency.linearRampToValueAtTime(200, now + 0.3);
                    osc.frequency.linearRampToValueAtTime(100, now + 0.6);
                    gainNode.gain.setValueAtTime(0.2, now);
                    gainNode.gain.linearRampToValueAtTime(0.01, now + 0.6);
                    osc.start(now); osc.stop(now + 0.6);
                }
            } catch(e) {}
        }

        // --- СИСТЕМА РЕЙТИНГА ---
        const recordsList = document.getElementById('records-list');
        let leaderboard = [];
        try { leaderboard = JSON.parse(localStorage.getItem('mushroomLeaderboard')) || []; } catch(e) { leaderboard = []; }

        function updateLeaderboardUI() {
            recordsList.innerHTML = '';
            if (leaderboard.length === 0) {
                recordsList.innerHTML = '<div class="record-row"><span style="color:#7f8c8d;">Пока нет рекордов...</span></div>';
                return;
            }
            leaderboard.slice(0, 5).forEach((record, index) => {
                const row = document.createElement('div');
                row.className = 'record-row';
                
                let diffName = 'АКША';
                if (record.diff === 'easy') diffName = 'ДОРОЖ';
                if (record.diff === 'hard') diffName = 'УРЕЙСК';
                
                let playerName = record.name ? record.name : 'Аноним';

                row.innerHTML = `
                    <span class="record-rank">#${index + 1}</span>
                    <span class="record-name">${playerName}</span>
                    <span class="record-score">${record.score}</span>
                    <span class="record-diff">${diffName}</span>
                `;
                recordsList.appendChild(row);
            });
        }

        function saveScore(finalScore, difficulty, playerName) {
            if (finalScore === 0) return; 
            
            if (!playerName || playerName.trim() === '') {
                playerName = 'Аноним';
            }

            leaderboard.push({ name: playerName, score: finalScore, diff: difficulty });
            leaderboard.sort((a, b) => b.score - a.score);
            leaderboard = leaderboard.slice(0, 10);
            
            try { localStorage.setItem('mushroomLeaderboard', JSON.stringify(leaderboard)); } catch(e) {}
            updateLeaderboardUI();
        }

        let currentPlayerName = '';
        try { currentPlayerName = localStorage.getItem('mushroomPlayerName') || ''; } catch(e) {}

        // --- ОСНОВНАЯ ЛОГИКА ---
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const container = document.getElementById('game-container');
        const bgElement = document.getElementById('background');
        const nightOverlay = document.getElementById('night-overlay');
        
        const startScreen = document.getElementById('start-screen');
        const gameOverScreen = document.getElementById('game-over-screen');
        const btnEasy = document.getElementById('btn-easy');
        const btnNormal = document.getElementById('btn-normal');
        const btnHard = document.getElementById('btn-hard');
        const restartBtn = document.getElementById('restart-btn');
        const menuBtn = document.getElementById('menu-btn');
        
        const nameInput = document.getElementById('name-input');
        const saveScoreBtn = document.getElementById('save-score-btn');
        const saveScoreBlock = document.getElementById('save-score-block');
        const saveBtnText = document.getElementById('save-btn-text');

        const finalScoreEl = document.getElementById('final-score');
        const phraseTextEl = document.getElementById('phrase-text');
        const hud = document.getElementById('hud');
        const scoreDisplay = document.getElementById('score-display');
        const livesDisplay = document.getElementById('lives-display');

        const phrases = [
            "Ваа, ты пашто голоуши то по зиме шасташ? Быром напялил шапку!",
            "Ты чё как зюзя по лесу шасташ? Холодно же!",
            "Ты чё моя болташ? Грибы-то в лесу, а не в корзине!",
            "Вот так всё браво и растёть!",
            "Ну ты и Кеша-курощуп, даже груздь поймать не смог.",
            "Харэ дурью маяться, как зунтугло, делай бравенько!",
            "Ой, ты какой бравенький, а грибочков-то маловато.",
            "Сзади хомут, Ермолаем зовут — вот твой результат.",
            "Ну ты и дикошарый! Даже гриб поймать — и то не смог!",
            "Ты мояточка, не расстраивайся, попробуй ещё раз."
        ];

        const comboPhrases = [
            "Браво та чё!",
            "Ты моя то",
            "Путёво!"
        ];

        let canvasWidth = 800, canvasHeight = 600, scaleFactor = 1;
        function resizeCanvas() {
            const rect = container.getBoundingClientRect();
            canvas.width = rect.width; canvas.height = rect.height;
            canvasWidth = rect.width; canvasHeight = rect.height;
            ctx.imageSmoothingEnabled = false;
            scaleFactor = Math.min(canvasWidth / 800, canvasHeight / 600);
            if (scaleFactor < 0.6) scaleFactor = 0.6;
        }
        window.addEventListener('resize', resizeCanvas);

        let score = 0, lives = 3, isGameOver = false, isGameRunning = false, spawnTimer = 0;
        let currentDifficulty = 'normal';
        let baseSpawnInterval = 50, baseFallSpeed = 2.3; 
        let spawnInterval = 50, fallSpeedBase = 2.3;
        let maxMushrooms = 8;
        let mushrooms = [], particles = [], touchRipples = [];
        let streak = 0, squirrelTimer = 0, timeOfDay = 0, dayCycleTimer = 0;
        let scoreAlreadySaved = false;
        
        let popupTexts = [];
        let nextMilestone = 2000; // УСЛОЖНЕНИЕ И ПОХВАЛА КАЖДЫЕ 2000

        let nextSquirrelTrigger = 600;

        let squirrel = {
            active: false, 
            x: -50, 
            y: -50, 
            targetX: 0, 
            targetY: 0, 
            state: 'idle', 
            timer: 0,
            caught: false
        };

        const mushroomTypes = [
            { name: 'Маслёнок', stem: '#d4a373', cap: '#8b4513', dots: false, points: 10, capType: 'round' },
            { name: 'Рыжик', stem: '#f5cba7', cap: '#e67e22', dots: false, points: 15, capType: 'chanterelle' }, 
            { name: 'Груздь', stem: '#fdfefe', cap: '#f0f3f4', dots: true, points: 20, capType: 'milkcap' }, 
            { name: 'Подосиновик', stem: '#ecf0f1', cap: '#c0392b', dots: false, points: 25, capType: 'round' }
        ];

        class Mushroom {
            constructor() {
                let rand = Math.random();
                let drunkChance = 0.10 + (Math.floor(score / 2000) * 0.03); 
                if (drunkChance > 0.35) drunkChance = 0.35; 

                if (rand < 0.05) {
                    this.type = { name: 'Золотой', stem: '#b8860b', cap: '#ffaa00', dots: true, points: 100, capType: 'golden' };
                } else if (rand < drunkChance) {
                    this.type = { name: 'Мухомор', stem: '#fdfdfd', cap: '#d32f2f', dots: true, points: 5, capType: 'amanita', isDrunk: true };
                } else {
                    this.type = mushroomTypes[Math.floor(Math.random() * mushroomTypes.length)];
                }

                this.baseRadius = 35 * scaleFactor;
                if (this.baseRadius < 25) this.baseRadius = 25;
                this.radius = this.baseRadius;
                
                this.x = Math.random() * (canvasWidth - this.radius * 2) + this.radius;
                this.y = -this.radius * 2;
                
                this.speed = (fallSpeedBase + Math.random() * 1.5) * scaleFactor;
                
                this.rotation = (Math.random() - 0.5) * 0.5;
                this.rotSpeed = (Math.random() - 0.5) * 0.02;
                this.clicked = false;
                this.opacity = 1;
            }

            update() {
                this.y += this.speed;
                this.rotation += this.rotSpeed;
                if (this.y - this.radius > canvasHeight && !this.clicked) {
                    this.clicked = true;
                    if (!this.type.isDrunk) {
                        loseLife();
                    }
                }
            }

            draw() {
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate(this.rotation);
                ctx.globalAlpha = this.opacity;

                let r = this.radius;
                let stemW = r * 0.35;
                let stemH = r * 0.9;

                // Тень
                ctx.fillStyle = 'rgba(0,0,0,0.3)';
                ctx.beginPath();
                ctx.ellipse(0, stemH/2, r * 0.8, r * 0.2, 0, 0, Math.PI * 2);
                ctx.fill();

                // Ножка
                ctx.fillStyle = this.type.stem;
                ctx.beginPath();
                ctx.moveTo(-stemW/2, 0);
                ctx.lineTo(-stemW/2.5, stemH);
                ctx.lineTo(stemW/2.5, stemH);
                ctx.lineTo(stemW/2, 0);
                ctx.fill();

                // Текстура ножки
                ctx.fillStyle = 'rgba(0,0,0,0.1)';
                ctx.fillRect(-stemW/4, 0, 2, stemH);
                ctx.fillRect(stemW/4, 0, 2, stemH);

                // --- ОТРИСОВКА ШЛЯПОК ---
                if (this.type.capType === 'amanita') {
                    // МУХОМОР
                    ctx.fillStyle = '#f0f3f4';
                    ctx.beginPath();
                    ctx.ellipse(0, stemH * 0.6, stemW * 1.5, stemH * 0.15, 0, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.strokeStyle = '#bdc3c7';
                    ctx.lineWidth = 2;
                    ctx.stroke();

                    ctx.fillStyle = '#d32f2f';
                    ctx.beginPath();
                    ctx.ellipse(0, -r * 0.1, r * 1.1, r * 0.45, 0, Math.PI, 0);
                    ctx.fill();
                    
                    ctx.fillStyle = '#f5f5f5';
                    ctx.beginPath();
                    ctx.ellipse(0, 0, r * 1.1, r * 0.2, 0, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.fillStyle = '#bdc3c7';
                    ctx.beginPath();
                    ctx.ellipse(0, r * 0.1, r * 0.9, r * 0.1, 0, 0, Math.PI * 2);
                    ctx.fill();

                    ctx.fillStyle = '#ffffff';
                    ctx.beginPath();
                    ctx.arc(-r * 0.5, -r * 0.2, r * 0.15, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.fillStyle = '#e0e0e0';
                    ctx.beginPath(); ctx.arc(-r * 0.45, -r * 0.15, r * 0.1, 0, Math.PI * 2); ctx.fill();
                    
                    ctx.fillStyle = '#ffffff';
                    ctx.beginPath(); ctx.arc(r * 0.4, -r * 0.3, r * 0.12, 0, Math.PI * 2); ctx.fill();
                    ctx.fillStyle = '#e0e0e0';
                    ctx.beginPath(); ctx.arc(r * 0.45, -r * 0.25, r * 0.08, 0, Math.PI * 2); ctx.fill();

                    ctx.fillStyle = '#ffffff';
                    ctx.beginPath(); ctx.arc(0, -r * 0.4, r * 0.18, 0, Math.PI * 2); ctx.fill();
                    ctx.fillStyle = '#e0e0e0';
                    ctx.beginPath(); ctx.arc(r * 0.05, -r * 0.35, r * 0.12, 0, Math.PI * 2); ctx.fill();

                    ctx.fillStyle = 'rgba(255,255,255,0.3)';
                    ctx.beginPath();
                    ctx.ellipse(-r * 0.6, -r * 0.4, r * 0.25, r * 0.1, -Math.PI/4, 0, Math.PI * 2);
                    ctx.fill();

                } else if (this.type.capType === 'golden') {
                    // ЗОЛОТОЙ ГРИБ
                    let gradient = ctx.createLinearGradient(0, -r, 0, 0);
                    gradient.addColorStop(0, '#fff700');
                    gradient.addColorStop(0.5, '#ffb300');
                    gradient.addColorStop(1, '#cc7a00');
                    
                    ctx.fillStyle = gradient;
                    ctx.beginPath();
                    ctx.arc(0, 0, r, Math.PI, 0);
                    ctx.fill();
                    
                    ctx.strokeStyle = 'rgba(204, 122, 0, 0.6)';
                    ctx.lineWidth = 2;
                    for(let i = 1; i <= 3; i++) {
                        ctx.beginPath();
                        ctx.arc(0, 0, r * (i/4), Math.PI, 0);
                        ctx.stroke();
                    }

                    ctx.fillStyle = '#a65d00';
                    ctx.beginPath();
                    ctx.ellipse(0, 0, r, r * 0.2, 0, 0, Math.PI * 2);
                    ctx.fill();

                    ctx.strokeStyle = '#8b5a00';
                    ctx.lineWidth = 3;
                    ctx.beginPath();
                    ctx.arc(0, 0, r, Math.PI, 0);
                    ctx.stroke();

                } else {
                    // ОБЫЧНЫЕ ГРИБЫ
                    ctx.fillStyle = this.type.cap;
                    if (this.type.capType === 'round') {
                        ctx.beginPath();
                        ctx.arc(0, 0, r, Math.PI, 0);
                        ctx.fill();
                    } else if (this.type.capType === 'chanterelle') {
                        ctx.beginPath();
                        ctx.moveTo(-r * 1.1, 0);
                        ctx.quadraticCurveTo(-r * 1.1, -r * 0.8, -r * 0.4, -r * 0.6);
                        ctx.quadraticCurveTo(0, -r * 0.5, r * 0.4, -r * 0.6);
                        ctx.quadraticCurveTo(r * 1.1, -r * 0.8, r * 1.1, 0);
                        ctx.fill();
                    } else if (this.type.capType === 'milkcap') {
                        ctx.beginPath();
                        ctx.ellipse(0, -r * 0.1, r * 1.1, r * 0.4, 0, 0, Math.PI * 2);
                        ctx.fill();
                    }
                    if (this.type.dots) {
                        ctx.fillStyle = '#bdc3c7';
                        ctx.beginPath();
                        ctx.arc(-r * 0.4, -r * 0.3, r * 0.08, 0, Math.PI * 2);
                        ctx.arc(r * 0.3, -r * 0.4, r * 0.1, 0, Math.PI * 2);
                        ctx.arc(0, -r * 0.1, r * 0.06, 0, Math.PI * 2);
                        ctx.fill();
                    }
                }
                ctx.restore();
            }

            checkClick(mx, my) {
                if (this.clicked) return false;
                let dx = mx - this.x;
                let dy = my - this.y;
                return Math.sqrt(dx * dx + dy * dy) < this.radius * 3.0;
            }

            pop() {
                this.clicked = true;
                this.opacity = 0;
                for (let i = 0; i < 15; i++) {
                    particles.push({
                        x: this.x, y: this.y,
                        vx: (Math.random() - 0.5) * 12,
                        vy: (Math.random() - 0.5) * 12,
                        color: this.type.isGolden ? '#ffd700' : (this.type.isDrunk ? '#e74c3c' : this.type.cap),
                        life: 1.0, size: Math.random() * 8 + 2
                    });
                }
            }
        }

        function drawSquirrel() {
            if (!squirrel.active || squirrel.caught) return;

            ctx.save();
            ctx.translate(squirrel.x, squirrel.y);
            
            let r = 40 * scaleFactor; 

            ctx.fillStyle = '#d35400';
            ctx.beginPath();
            ctx.ellipse(-r * 0.8, -r * 0.2, r * 0.8, r * 0.5, -Math.PI/4, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = '#e67e22';
            ctx.beginPath();
            ctx.ellipse(0, 0, r * 0.7, r * 0.5, 0, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = '#e67e22';
            ctx.beginPath();
            ctx.arc(r * 0.4, -r * 0.1, r * 0.4, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = '#d35400';
            ctx.beginPath();
            ctx.moveTo(r * 0.35, -r * 0.5);
            ctx.lineTo(r * 0.5, -r * 0.9);
            ctx.lineTo(r * 0.65, -r * 0.5);
            ctx.fill();

            ctx.beginPath();
            ctx.moveTo(r * 0.55, -r * 0.5);
            ctx.lineTo(r * 0.7, -r * 0.8);
            ctx.lineTo(r * 0.8, -r * 0.45);
            ctx.fill();

            ctx.fillStyle = '#000';
            ctx.beginPath();
            ctx.arc(r * 0.55, -r * 0.15, r * 0.12, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = '#fff';
            ctx.beginPath();
            ctx.arc(r * 0.58, -r * 0.18, r * 0.04, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = '#d35400';
            ctx.fillRect(-r * 0.2, r * 0.4, r * 0.3, r * 0.3);
            ctx.fillRect(r * 0.1, r * 0.4, r * 0.3, r * 0.3);

            ctx.restore();
        }

        function spawnMushroom() {
            if (mushrooms.length > maxMushrooms) return;
            if (Math.random() < 0.8) mushrooms.push(new Mushroom());
        }

        function loseLife() {
            lives--;
            streak = 0; 
            livesDisplay.innerText = lives;
            playSound('lose');
            
            container.animate([
                { transform: 'translate(0, 0)' }, { transform: 'translate(-10px, 5px)' },
                { transform: 'translate(10px, -5px)' }, { transform: 'translate(0, 0)' }
            ], { duration: 200, iterations: 1 });

            if (lives <= 0) endGame();
        }

        function endGame() {
            isGameOver = true;
            isGameRunning = false;
            finalScoreEl.innerText = score;
            playSound('gameover');
            phraseTextEl.innerText = phrases[Math.floor(Math.random() * phrases.length)];
            
            if (score > 0) {
                saveScoreBlock.style.display = 'block';
                nameInput.value = currentPlayerName;
                scoreAlreadySaved = false;
                
                saveBtnText.innerText = 'СОХРАНИТЬ РЕКОРД';
                saveScoreBtn.style.backgroundColor = '#27ae60';
                saveScoreBtn.style.boxShadow = '0 5px 0 #1e8449';
                saveScoreBtn.disabled = false;
            } else {
                saveScoreBlock.style.display = 'none';
            }

            hud.classList.add('hidden');
            gameOverScreen.classList.remove('hidden');
        }

        function startGame(difficulty) {
            initAudio(); 
            currentDifficulty = difficulty;
            
            // --- РАЗНЫЕ ЖИЗНИ, ОДИНАКОВАЯ СЛОЖНОСТЬ ---
            if (difficulty === 'easy') { 
                lives = 3; 
            } else if (difficulty === 'normal') { 
                lives = 2; 
            } else if (difficulty === 'hard') { 
                lives = 1; 
            }

            isGameRunning = true; isGameOver = false; score = 0; streak = 0;
            mushrooms = []; particles = []; touchRipples = []; popupTexts = []; spawnTimer = 0;
            squirrelTimer = 0; dayCycleTimer = 0; timeOfDay = 0; 
            nextMilestone = 2000; // СБРОС
            
            nextSquirrelTrigger = 600 + Math.random() * 200; 

            squirrel.active = false;
            squirrel.caught = false;
            squirrel.state = 'idle';

            bgElement.style.filter = 'contrast(1.3) saturate(1.4) blur(2px) brightness(0.6)';
            nightOverlay.style.opacity = '0';
            container.classList.remove('drunk-mode');
            
            scoreDisplay.innerText = score; livesDisplay.innerText = lives;
            startScreen.classList.add('hidden'); gameOverScreen.classList.add('hidden'); hud.classList.remove('hidden');
        }

        function gameLoop() {
            ctx.clearRect(0, 0, canvasWidth, canvasHeight);

            if (isGameRunning) {
                let currentLevel = Math.floor(score / 2000); // УСЛОЖНЕНИЕ КАЖДЫЕ 2000
                let speedBonus = currentLevel * 0.15; 
                if (speedBonus > 1.5) speedBonus = 1.5; 
                
                fallSpeedBase = baseFallSpeed * (1 + speedBonus);

                let intervalReduction = currentLevel * 8;
                spawnInterval = baseSpawnInterval - intervalReduction;
                if (spawnInterval < 25) spawnInterval = 25; 

                spawnTimer++;
                if (spawnTimer >= spawnInterval) { spawnMushroom(); spawnTimer = 0; }
                
                dayCycleTimer++;
                if (dayCycleTimer > 1800) {
                    dayCycleTimer = 0;
                    timeOfDay = (timeOfDay + 1) % 4;
                    if (timeOfDay === 0) { bgElement.style.filter = 'contrast(1.3) saturate(1.4) blur(2px) brightness(0.6)'; nightOverlay.style.opacity = '0'; }
                    else if (timeOfDay === 1) { bgElement.style.filter = 'contrast(1.2) saturate(1.5) blur(2px) brightness(0.7) sepia(0.4) hue-rotate(-30deg)'; nightOverlay.style.opacity = '0.2'; }
                    else if (timeOfDay === 2) { bgElement.style.filter = 'contrast(1.1) saturate(0.8) blur(3px) brightness(0.4) hue-rotate(200deg)'; nightOverlay.style.opacity = '0.5'; }
                    else { bgElement.style.filter = 'contrast(1.2) saturate(1.2) blur(2px) brightness(0.7) sepia(0.2)'; nightOverlay.style.opacity = '0.1'; }
                }

                if (!squirrel.active) {
                    squirrelTimer++;
                    if (squirrelTimer > nextSquirrelTrigger && mushrooms.length > 0) {
                        squirrel.active = true;
                        squirrel.caught = false;
                        squirrel.state = 'runningIn';
                        squirrel.x = -50; squirrel.y = canvasHeight - 50;
                        let targetIndex = Math.floor(Math.random() * mushrooms.length);
                        squirrel.targetX = mushrooms[targetIndex].x;
                        squirrel.targetY = mushrooms[targetIndex].y;
                        playSound('squirrel');
                    }
                } else if (squirrel.active && !squirrel.caught) {
                    if (squirrel.state === 'runningIn') {
                        let dx = squirrel.targetX - squirrel.x;
                        let dy = squirrel.targetY - squirrel.y;
                        let dist = Math.sqrt(dx*dx + dy*dy);
                        if (dist > 10) {
                            squirrel.x += (dx / dist) * 8 * scaleFactor;
                            squirrel.y += (dy / dist) * 8 * scaleFactor;
                        } else {
                            squirrel.state = 'biting';
                            squirrel.timer = 0;
                        }
                    } else if (squirrel.state === 'biting') {
                        squirrel.timer++;
                        if (squirrel.timer > 15) {
                            for (let i = mushrooms.length - 1; i >= 0; i--) {
                                if (Math.abs(mushrooms[i].x - squirrel.x) < 50 && Math.abs(mushrooms[i].y - squirrel.y) < 50) {
                                    score += mushrooms[i].type.points;
                                    scoreDisplay.innerText = score;
                                    mushrooms[i].pop();
                                    break;
                                }
                            }
                            squirrel.state = 'runningOut';
                        }
                    } else if (squirrel.state === 'runningOut') {
                        squirrel.x += 10 * scaleFactor;
                        if (squirrel.x > canvasWidth + 50) { 
                            squirrel.active = false; 
                            squirrel.state = 'idle'; 
                            
                            squirrelTimer = 0; 
                            nextSquirrelTrigger = 600 + Math.random() * 200; 
                        }
                    }
                }

                for (let i = mushrooms.length - 1; i >= 0; i--) {
                    let m = mushrooms[i];
                    m.update();
                    m.draw();
                    if (m.y - m.radius > canvasHeight || m.clicked) mushrooms.splice(i, 1);
                }

                for (let i = popupTexts.length - 1; i >= 0; i--) {
                    let pt = popupTexts[i];
                    pt.y -= 1.5; 
                    pt.life -= 0.02;
                    
                    ctx.fillStyle = `rgba(241, 196, 15, ${pt.life})`;
                    ctx.font = `bold ${40 * scaleFactor}px 'Russo One'`;
                    ctx.textAlign = 'center';
                    ctx.strokeStyle = `rgba(0, 0, 0, ${pt.life})`;
                    ctx.lineWidth = 6; 
                    ctx.strokeText(pt.text, pt.x, pt.y);
                    ctx.fillText(pt.text, pt.x, pt.y);
                    
                    if (pt.life <= 0) popupTexts.splice(i, 1);
                }

                for (let i = particles.length - 1; i >= 0; i--) {
                    let p = particles[i];
                    p.x += p.vx; p.y += p.vy; p.vy += 0.3; p.life -= 0.03; p.size *= 0.95;
                    ctx.fillStyle = p.color; ctx.globalAlpha = p.life; ctx.fillRect(p.x, p.y, p.size, p.size); ctx.globalAlpha = 1;
                    if (p.life <= 0 || p.size < 1) particles.splice(i, 1);
                }

                for (let i = touchRipples.length - 1; i >= 0; i--) {
                    let r = touchRipples[i];
                    r.radius += 2; r.life -= 0.05;
                    ctx.beginPath(); ctx.arc(r.x, r.y, r.radius, 0, Math.PI * 2);
                    ctx.strokeStyle = `rgba(241, 196, 15, ${r.life})`; ctx.lineWidth = 3; ctx.stroke();
                    if (r.life <= 0) touchRipples.splice(i, 1);
                }

                drawSquirrel();
            }
            requestAnimationFrame(gameLoop);
        }

        function processTouch(clientX, clientY) {
            if (!isGameRunning) return;
            let rect = canvas.getBoundingClientRect();
            let mx = clientX - rect.left;
            let my = clientY - rect.top;

            touchRipples.push({ x: mx, y: my, radius: 5, life: 1.0 });

            if (squirrel.active && !squirrel.caught) {
                let sdx = mx - squirrel.x;
                let sdy = my - squirrel.y;
                let sdist = Math.sqrt(sdx*sdx + sdy*sdy);
                let squirrelRadius = 40 * scaleFactor * 1.5; 
                
                if (sdist < squirrelRadius) {
                    squirrel.caught = true;
                    score += 1000;
                    scoreDisplay.innerText = score;
                    playSound('squirrelCatch');
                    
                    for (let i = 0; i < 30; i++) {
                        particles.push({
                            x: squirrel.x, y: squirrel.y,
                            vx: (Math.random() - 0.5) * 20,
                            vy: (Math.random() - 0.5) * 20,
                            color: '#ffd700',
                            life: 1.5, size: Math.random() * 10 + 3
                        });
                    }
                    
                    squirrel.x = canvasWidth + 100;
                    squirrel.active = false;
                    squirrel.state = 'idle';
                    
                    squirrelTimer = 0; 
                    nextSquirrelTrigger = 600 + Math.random() * 200; 
                    return;
                }
            }

            let hitCount = 0;
            for (let i = mushrooms.length - 1; i >= 0; i--) {
                let m = mushrooms[i];
                if (!m.clicked && m.checkClick(mx, my)) {
                    m.pop();
                    score += m.type.points;
                    hitCount++;
                    
                    if (m.type.isGolden) { playSound('golden'); } 
                    else if (m.type.isDrunk) {
                        playSound('drunk');
                        container.classList.add('drunk-mode');
                        setTimeout(() => container.classList.remove('drunk-mode'), 3000);
                    } else {
                        playSound('pop');
                        streak++;
                        
                        // ПОХВАЛЫ И УСЛОЖНЕНИЕ КАЖДЫЕ 2000
                        if (score >= nextMilestone) {
                            let randomPhrase = comboPhrases[Math.floor(Math.random() * comboPhrases.length)];
                            popupTexts.push({
                                text: randomPhrase,
                                x: canvasWidth / 2,
                                y: canvasHeight / 2, 
                                life: 2.0
                            });
                            nextMilestone += 2000; 
                        }

                        // УБРАН БОНУС ЗА 5 ПОДРЯД (ЖИЗНИ НЕ ВОЗРАСТАЮТ)
                        if (streak >= 5) {
                            // Просто сбрасываем серию, не давая жизнь
                            streak = 0; 
                        }
                    }
                }
            }
            if (hitCount > 0) scoreDisplay.innerText = score;
        }

        canvas.addEventListener('mousedown', (e) => processTouch(e.clientX, e.clientY));
        canvas.addEventListener('touchstart', (e) => {
            e.preventDefault();
            for (let i = 0; i < e.touches.length; i++) processTouch(e.touches[i].clientX, e.touches[i].clientY);
        }, { passive: false });

        const addTap = (btn, callback) => {
            btn.addEventListener('touchstart', (e) => { e.preventDefault(); callback(); }, { passive: false });
            btn.addEventListener('click', callback);
        };
        
        addTap(btnEasy, () => startGame('easy'));
        addTap(btnNormal, () => startGame('normal'));
        addTap(btnHard, () => startGame('hard'));
        
        addTap(restartBtn, () => startGame(currentDifficulty));
        addTap(menuBtn, () => { gameOverScreen.classList.add('hidden'); startScreen.classList.remove('hidden'); });

        addTap(saveScoreBtn, () => {
            if (scoreAlreadySaved) return;
            
            let playerName = nameInput.value.trim();
            if (playerName === '') playerName = 'Аноним';
            
            currentPlayerName = playerName;
            try { localStorage.setItem('mushroomPlayerName', playerName); } catch(e) {}
            
            saveScore(score, currentDifficulty, playerName);
            
            scoreAlreadySaved = true;
            saveBtnText.innerText = 'СОХРАНЕНО!';
            
            saveScoreBtn.style.backgroundColor = '#7f8c8d';
            saveScoreBtn.style.boxShadow = '0 5px 0 #566573';
        });

        window.addEventListener('load', () => { resizeCanvas(); updateLeaderboardUI(); gameLoop(); });
        resizeCanvas(); updateLeaderboardUI(); gameLoop();
    </script>
